services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-go:
    build: ./api-go
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pdf_data:/data/pdf
      - planning_data:/data/plannings

  front-php:
    build: ./front-php
    env_file: .env
    depends_on:
      - api-go
    volumes:
      - ./front-php:/var/www/app
      - front_vendor:/var/www/app/vendor

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - api-go
      - front-php
    volumes:
      - ./front-php:/var/www/app:ro
      - front_vendor:/var/www/app/vendor:ro

volumes:
  pgdata:
  pdf_data:
  planning_data:
  front_vendor:
