server {
    listen 80;
    server_name _;

    # --- Pages d'erreur personnalisées ---
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/500.html;

    location /errors/ {
        internal;
        root /usr/share/nginx/html;
    }

    # --- Routage vers l'API Go ---
    # Toute URL commençant par /api/ est transmise telle quelle au conteneur api-go.
    location /api/ {
        proxy_pass http://api-go:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # IMPORTANT : off, et pas on.
        # Avec "on", nginx remplaçait les réponses d'erreur de l'API par ses
        # propres pages HTML. Résultat : un client qui appelait l'API et se
        # trompait recevait une page web au lieu du message "Commercant
        # introuvable" — donc impossible de savoir ce qui n'allait pas.
        # Les pages d'erreur personnalisées (exigence du sujet) restent
        # actives pour le SITE (voir plus bas) ; l'API, elle, doit pouvoir
        # renvoyer ses propres messages à celui qui l'appelle.
        proxy_intercept_errors off;
    }

    # --- Routage vers le front FlightPHP ---
    root /var/www/app/public;
    index index.php;

    # Réécriture d'URL : si le fichier/dossier demandé n'existe pas physiquement,
    # on redirige vers index.php qui se charge lui-même de router la requête
    # (permet des URLs "propres" type /commercants/12 au lieu de /index.php?id=12).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass front-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_intercept_errors on;
    }

    # Empêche l'accès direct à des fichiers sensibles s'ils traînent dans public/
    location ~ /\.(env|git) {
        deny all;
    }
}
